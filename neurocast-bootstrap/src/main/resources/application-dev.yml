server:
  port: 8189

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/neurocast
    username: thingsboard
    password: "thingsboard"
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: select 'x'
      test-while-idle: true
  data:
    redis:
      host: redis
      port: 6379
      password: mMDPvXF5yYpsj2T6
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms

# ==================== 平台自定义配置 ====================
neurocast:
  # JWT 认证（新项目新增，旧项目无登录体系；密钥请按需修改）
  jwt:
    secret: neurocast-dev2-secret-key-please-change-it!
    header: Authorization
    token-prefix: "Bearer "
    access-token-expire-seconds: 7200
    refresh-token-expire-days: 7

  # ThingsBoard 集成（旧 remote-rpc.thingsboard.*）
  thingsboard:
    url: http://thingsboard:9090/
    username: tenant@thingsboard.org
    password: tenant
    device-profile-id: 03746350-914b-11f1-b4f6-932edadd00d3

  # SRS 流媒体服务器（旧 srs.server.* + remote-rpc.srs.url）
  srs:
    api-url: http://47.121.24.61:1985
    base-url: https://dev-neurocast-api.joycrystal.com/
    push-camera-stream-url: rtmp://47.121.24.61/live/{deviceUid}?accessToken={accessToken}

  # FTP 文件服务器（旧 ftp.server.*，下发给设备的系统配置）
  ftp:
    host: 47.121.24.61
    port: 21
    username: camera_ftp
    password: EFeZ5yawAQJ80Y7oHtIS
    files-path: /home/ubuntu/docker/ftp/data/files

  # FRP 内网穿透（旧 frps.* + remote-rpc.ports.url）
  frp:
    server-addr: 47.121.24.61
    server-port: 10000
    method: token
    token: oEfKXvHqPcLNYQkw467F
    port-service-url: http://47.121.24.61:5000

  # 媒体文件（旧 file.*）
  file:
    base-path: ./files
    # 注意：新下载接口路径为 /api/file/download（旧为 /api/v1/camera/file/download），网关路由需同步
    download-base-url: https://dev-neurocast-api.joycrystal.com/api/file/download
    image-retention-days: 7
    video-retention-days: 7
    upload-max-size: 104857600
    chunk-expire-hours: 24
    upload-file-base-url: https://dev-neurocast-api.joycrystal.com/api/device/file/upload
    upload-file-api-key: da20956ac0c74eeebf6eb9a90b46dff7
